name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run ruff check app/
      - run: uv run ruff format --check app/
      - run: uv run pytest
        env:
          SECRET_KEY: ci-secret-key-for-testing-only-not-production
          DEBUG: "False"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: app
          DB_USER: app
          DB_PASSWORD: app
          DB_HOST: localhost
          DB_PORT: "5432"
